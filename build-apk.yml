
name: Build Reel Monster APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android project structure
        run: |
          echo "Checking Reel Monster project..."

          test -f settings.gradle.kts || {
            echo "ERROR: settings.gradle.kts missing"
            exit 1
          }

          test -f build.gradle.kts || {
            echo "ERROR: Root build.gradle.kts missing"
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "ERROR: app/build.gradle.kts missing"
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml missing"
            exit 1
          }

          echo "Project structure looks correct!"

      - name: Build Reel Monster APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Reel Monster APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelMonster-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
